spring:
  application:
    name: aiops-agent-platform
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

aiops:
  skills-directory: ${AIOPS_SKILLS_DIR:skills}
  runbooks-directory: ${AIOPS_RUNBOOKS_DIR:runbooks}
  reports-directory: ${AIOPS_REPORTS_DIR:reports}
  task-timeout: 5m
  sse-timeout: 30m
  agent-decision-timeout: 60s
  max-agent-steps: 8
  sse-heartbeat-ms: 15000

logging:
  pattern:
    level: "%5p [taskId:%X{taskId:-}]"

---
spring:
  config:
    activate:
      on-profile: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

---
spring:
  config:
    activate:
      on-profile: llm
aiops:
  llm:
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
